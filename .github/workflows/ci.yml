name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-js:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run linter (optional)
        run: pnpm run lint || echo "Linting failed but continuing with build..."
        continue-on-error: true

      - name: Run tests
        run: pnpm test

      - name: Build project
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VUE_APP_GOOGLE_CLIENT_ID }}
        run: pnpm run build

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Create virtual environment
        run: uv venv .venv-test --python 3.11

      - name: Install dependencies
        run: uv pip install -r requirements.txt --python .venv-test/bin/python

      - name: Run Python tests
        run: |
          cd python
          ../.venv-test/bin/python -m pytest tests/ -v